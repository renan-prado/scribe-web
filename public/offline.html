<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexão — Scriba</title>
    <!--
      A tela que o app mostra quando o aparelho está offline. Quem a serve é o
      `public/sw.js`, do cache, quando uma navegação falha na rede.

      TUDO aqui é inline de propósito, e este é o ÚNICO arquivo do projeto onde
      cor literal é aceitável. Offline não existe rede: um <link> para o CSS do
      Next não carrega, e a página apareceria como HTML pelado. Pelo mesmo
      motivo os valores abaixo são cópias dos tokens de `app/globals.css`
      (`--background`, `--scriba-paper`, `--scriba-ink-strong`, `--scriba-blue-ink`,
      `--scriba-hairline`) — se a paleta mudar lá, atualize aqui no mesmo commit.

      A pena continua vindo de `public/brand/pena.svg`, por máscara CSS, para não
      duplicar o `<path>` da marca mais uma vez (ver src/shared/AGENTS.md).
    -->
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --paper: #ffffff;
        --ink: #33414f;
        --ink-soft: #566474;
        --accent: #3473aa;
        --hairline: #edf2f7;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0f0d1e;
        --paper: #1a1733;
        --ink: #f2f0fa;
        --ink-soft: #a5a0c1;
        --accent: #8ac6fa;
        --hairline: #272247;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 360px;
        text-align: center;
        background: var(--paper);
        border: 1px solid var(--hairline);
        border-radius: 28px;
        padding: 40px 28px;
      }
      .mark {
        width: 44px;
        height: 44px;
        margin: 0 auto 20px;
        background-color: var(--accent);
        -webkit-mask: url("/brand/pena.svg") center / contain no-repeat;
        mask: url("/brand/pena.svg") center / contain no-repeat;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        color: var(--ink-soft);
      }
      button {
        margin-top: 24px;
        width: 100%;
        padding: 13px 20px;
        border: 1px solid var(--hairline);
        border-radius: 999px;
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>Você está sem conexão</h1>
      <p>
        O Scriba precisa de internet para transcrever e resumir. Assim que a
        conexão voltar, é só tentar de novo — nada do que já foi gravado se
        perde.
      </p>
      <button type="button" id="retry">Tentar de novo</button>
    </main>
    <script>
      // Mesma chave e mesmo padrão claro do `ThemeScript` — ver
      // src/shared/components/ThemeScript.tsx.
      try {
        var t = localStorage.getItem("scriba-theme");
        document.documentElement.setAttribute(
          "data-theme",
          t === "dark" ? "dark" : "light"
        );
      } catch (e) {}
      // O handler fica AQUI, e não num `onclick=` no markup: atributo de
      // evento é o primeiro a cair sob qualquer CSP mais apertada que a de
      // hoje, e ele falharia em silêncio.
      document.getElementById("retry").addEventListener("click", function () {
        location.reload();
      });
      // A conexão voltou com a página aberta: recarrega sozinho, para o
      // usuário não ficar olhando para um aviso que já não vale.
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
